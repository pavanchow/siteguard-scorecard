name = "siteguard-scorecard-scanner"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# CORS settings for frontend access
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

# Allow requests from frontend during development
[site]
bucket = "./public"
